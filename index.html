<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff7a00" />
  <meta name="description" content="Find din beboerlicenszone i København med GPS." />
  <title>P-zone København</title>

  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://tile.openstreetmap.org" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./styles.css" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="P-zone" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <main class="app-shell compact-app">

    <header class="compact-header">
      <img class="brand-app-icon" src="/apple-touch-icon.png" alt="P-zone" />
      <span id="dataStatus" class="sr-only" data-state="loading">Henter zoner…</span>
    </header>

    <section class="compact-zone-row" aria-live="polite">
      <span class="compact-label">Din zone:</span>
      <strong id="zoneTitle" class="compact-zone-value">Ikke fundet</strong>
      <span class="compact-separator">·</span>
      <span id="accuracyText" class="compact-gps">GPS ikke startet</span>
      <span class="compact-separator compact-update-separator">·</span>
      <button id="locateBtn" class="compact-update-btn" type="button">Find</button>

      <p id="zoneText" class="sr-only">Brug GPS eller vælg en zone på kortet.</p>
      <button id="retryDataBtn" class="sr-only" type="button" hidden>Prøv zonedata igen</button>
    </section>

    <section class="compact-map-card" aria-label="Kort over beboerlicenszoner">
      <div class="compact-select-row">
        <label for="zoneSelect">Se zone:</label>
        <select id="zoneSelect" disabled aria-label="Vælg beboerlicenszone">
          <option value="">Indlæser zoner…</option>
        </select>
      </div>

      <input id="zonesToggle" class="sr-only" type="checkbox" checked disabled aria-hidden="true" />

      <div class="map-stage">
        <div id="map" role="application" aria-label="Interaktivt kort over Københavns beboerlicenszoner"></div>

        <button id="recenterBtn" class="recenter-btn" type="button"
          aria-label="Centrer kortet på min GPS-position" title="Centrer på min position">
          <span aria-hidden="true">⌖</span>
        </button>

        <div class="map-legend" aria-label="Kortforklaring">
          <span><i class="legend-zone"></i> Betaling/licens</span>
          <span><i class="legend-free"></i> Gratis · tidsbegrænset</span>
        </div>
      </div>
    </section>

    <div id="mapStatus" class="status-banner" data-tone="neutral" role="status">
      Henter de officielle beboerlicenszoner…
    </div>

    <footer class="app-footer">
      <p>Kortet er vejledende. Tjek altid lokal skiltning og afmærkning.</p>
    </footer>
  </main>

  <noscript>Denne app kræver JavaScript for at vise kort, zoner og GPS.</noscript>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
